name: Notify QRACON website directory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment event to the website directory
        env:
          PAGES_DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$PAGES_DISPATCH_TOKEN" ]]; then
            echo "::error title=Missing secret::Set the PAGES_DISPATCH_TOKEN Actions secret with Contents: write access to QRACON-tw/qracon-tw.github.io."
            exit 1
          fi

          payload=$(jq -n \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg ref "$SOURCE_REF" \
            --arg sha "$SOURCE_SHA" \
            '{event_type:"annual-site-updated",client_payload:{repository:$repository,ref:$ref,sha:$sha}}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PAGES_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/QRACON-tw/qracon-tw.github.io/dispatches
